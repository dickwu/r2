name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          # windows-latest and windows-2025 both resolve to the same
          # windows-2025-vs2026 preview image at present.
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      # import.meta.dirname (scripts/audit-source.mjs, scripts/provider-fault-audit.mjs)
      # needs Node >= 20.11; pin instead of relying on whatever the runner
      # image happens to ship, so the harness self-tests below don't silently
      # depend on ambient tooling.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          # v1: runner image 20260824 relinked the cached Windows test binary
          # into a broken state (STATUS_ENTRYPOINT_NOT_FOUND); a stale target
          # dir keeps resurrecting that exe, so start the caches over.
          prefix-key: v1-rust

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf ffmpeg libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libsqlite3-dev pkg-config libpipewire-0.3-dev nfs-common

      - name: Install ffmpeg, cmake, and ninja (macOS)
        if: matrix.platform == 'macos-latest'
        run: brew install ffmpeg pkg-config cmake ninja

      - name: Install dependencies (Windows)
        if: contains(matrix.platform, 'windows')
        run: |
          choco install ffmpeg sqlite -y
          echo "FFMPEG_DIR=C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg" >> $env:GITHUB_ENV
          echo "SQLITE3_LIB_DIR=C:\ProgramData\chocolatey\lib\SQLite\tools" >> $env:GITHUB_ENV
          # Test binaries link against the choco ffmpeg/sqlite import libs, but
          # Windows resolves their DLLs through PATH at load time. Runner image
          # 20260824 put mismatched copies of those DLLs earlier on PATH, which
          # kills the test exe with STATUS_ENTRYPOINT_NOT_FOUND before any test
          # runs. GITHUB_PATH entries are prepended, so the linked copies win.
          echo "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\lib\SQLite\tools" >> $env:GITHUB_PATH
          # Recorded so the day the image converges (or an older SDK appears)
          # the Windows test-execution skip below can be lifted knowingly.
          echo "Windows SDKs on this image:"
          Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\Lib" -Directory -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Acceptance harness self-tests (offline)
        # bash -eo pipefail fails on the first failing self-test; the Windows
        # pwsh default would only report the last command's exit code.
        shell: bash
        run: |
          node scripts/r2-audit-manifest.mjs --self-test
          node scripts/r2-protocol-audit.mjs --self-test
          node scripts/aws-s3-protocol-audit.mjs --self-test
          node scripts/provider-fault-audit.mjs --self-test
          node scripts/vm-boundary-audit.mjs --self-test
          python3 scripts/vm-powerloss-audit.py --self-test
          python3 scripts/run-native-nfs-test.py --self-test

      - name: Frontend checks
        run: bun run check

      - name: Rust format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all --check

      - name: Rust clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --workspace --all-targets -- -D warnings

      # On the windows-2025-vs2026 preview image every freshly linked test
      # binary dies at load with STATUS_ENTRYPOINT_NOT_FOUND (0xc0000139).
      # dumpbin shows the exe imports only core system DLLs, and neither the
      # toolchain's own CRT redist staged beside the exe nor a fully static
      # CRT makes it loadable — the new SDK's import libraries reference
      # system-DLL exports the image's own OS does not carry yet. PATH
      # prepends, redist staging and crt-static were each measured and each
      # changed nothing, so this is not fixable from a workflow: Windows
      # compiles the tests but does not execute them until the image's
      # toolchain and OS converge. Test *behaviour* stays covered by the macOS
      # and Linux jobs, and Windows linkage by this compile plus the build.
      # The image still reports a lone SDK 10.0.26100.0 as of 2026-09-13; the
      # "Install dependencies (Windows)" step logs that list so the skip can
      # be lifted knowingly.
      - name: Rust tests${{ contains(matrix.platform, 'windows') && ' (Windows compile-only)' || '' }}
        run: cargo test --manifest-path src-tauri/Cargo.toml --workspace ${{ contains(matrix.platform, 'windows') && '--no-run' || '' }}

      - name: Native Linux NFS integration
        if: matrix.platform == 'ubuntu-22.04'
        run: python3 scripts/run-native-nfs-test.py --sudo

      - name: Prepare Windows NFS client
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: ./scripts/prepare-windows-nfs.ps1

      # The runner executes the compiled test binary to reach the mount, so it
      # hits the same 0xc0000139 loader wall as the Rust test step above (the
      # script deliberately fails on a loader error rather than reporting a
      # skipped test as success). Validate the Windows prerequisites the
      # prepare step just established; the mount itself is covered by the
      # Linux job and by on-device verification until the image converges.
      - name: Native Windows NFS prerequisite validation (no runtime mount)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: python scripts/run-native-nfs-test.py --validate-only

      # STATUS_ENTRYPOINT_NOT_FOUND carries no DLL name; when the Windows test
      # binary dies at load time this shows, in PATH order, every copy of each
      # DLL it could have resolved — the shadowing copy is the first line.
      - name: Diagnose Windows DLL resolution
        if: failure() && contains(matrix.platform, 'windows')
        shell: pwsh
        run: |
          foreach ($dll in 'avcodec*.dll','avformat*.dll','avutil*.dll','swscale*.dll','swresample*.dll','sqlite3.dll','vcruntime140.dll') {
            Write-Host "=== $dll ==="
            where.exe $dll 2>$null
          }
          Write-Host "=== choco ffmpeg bin ==="
          Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin" -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name
          Write-Host "=== test exe dependents ==="
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          $exe = Get-ChildItem src-tauri\target\debug\deps\r2_lib-*.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if ($dumpbin -and $exe) { & $dumpbin.FullName /dependents $exe.FullName }

      - name: Build frontend
        run: bun run build

      - name: Debug - Check signing key
        run: echo "TAURI_SIGNING_PRIVATE_KEY length is ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && 'SET' || 'EMPTY' }}"

      - name: Build Tauri app
        run: bun tauri build ${{ matrix.args }}
        env:
          CI: true
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v7
        with:
          name: macos-${{ contains(matrix.args, 'aarch64') && 'arm64' || 'x64' }}
          path: |
            src-tauri/target/*/release/bundle/dmg/*.dmg
            src-tauri/target/*/release/bundle/macos/*.app
          if-no-files-found: error

      - name: Upload artifacts (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v7
        with:
          name: linux-x64
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
