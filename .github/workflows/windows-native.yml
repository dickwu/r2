name: Windows native behavior

on:
  workflow_dispatch:
  pull_request:
    branches: [main, master]
    paths:
      - 'src-tauri/**'
      - 'scripts/run-native-nfs-test.py'
      - 'scripts/prepare-windows-nfs.ps1'
      - '.github/workflows/windows-native.yml'

permissions:
  contents: read

concurrency:
  group: windows-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-behavior:
    # A separate runtime gate from the preview-image compile/prerequisite lane.
    # No loader failure, reboot request, empty test run or skipped mount passes.
    strategy:
      matrix:
        # Defined once: the evidence records this label and the acceptance
        # gate checks it, so it can never disagree with runs-on.
        runner: [windows-2022]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7

      # import.meta.dirname (scripts/audit-source.mjs) needs Node >= 20.11;
      # pin instead of relying on whatever the runner image happens to ship.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Captured immediately after checkout, before bun/cargo touch the
      # working tree, so the fingerprint reflects exactly what was checked
      # out and is not disturbed by build-step side effects.
      - name: Capture production source fingerprint
        shell: pwsh
        run: node scripts/audit-source.mjs --json | Out-File source-fingerprint.json -Encoding utf8

      # The runner context is not available to job-level env.
      - name: Place the Cargo target directory in runner temp
        shell: pwsh
        run: '"CARGO_TARGET_DIR=$env:RUNNER_TEMP\r2-native-target" | Out-File $env:GITHUB_ENV -Append -Encoding utf8'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13
      - uses: dtolnay/rust-toolchain@stable

      - name: Select the Windows 10 SDK for native execution
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = '10.0.19041.0'
          $sdkLib = "${env:ProgramFiles(x86)}\Windows Kits\10\Lib\$sdk"
          if (-not (Test-Path $sdkLib)) { throw "Required runtime SDK is absent: $sdk" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products '*' -property installationPath
          if (-not $vs) { throw 'Visual Studio installation is absent' }
          $devcmd = Join-Path $vs 'Common7\Tools\VsDevCmd.bat'
          $command = "`"$devcmd`" -arch=x64 -host_arch=x64 -winsdk=$sdk >nul && set"
          $configured = & $env:ComSpec /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw 'Cannot initialize the selected SDK/toolchain' }
          $selected = @{}
          foreach ($line in $configured) {
            $pair = $line -split '=', 2
            if ($pair.Length -eq 2 -and $pair[0] -match '^(PATH|LIB|LIBPATH|INCLUDE|WindowsSdkDir|WindowsSDKVersion|VCToolsInstallDir|VCINSTALLDIR|VSINSTALLDIR)$') {
              $selected[$pair[0]] = $pair[1]
              "$($pair[0])=$($pair[1])" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            }
          }
          if ($selected.WindowsSDKVersion.TrimEnd('\') -ne $sdk) { throw 'Selected SDK does not match the runtime gate' }
          "R2_NATIVE_SDK=$sdk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install native runtime libraries
        shell: pwsh
        run: |
          choco install ffmpeg sqlite -y
          if ($LASTEXITCODE -ne 0) { throw 'Native runtime dependency installation failed' }
          'FFMPEG_DIR=C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'SQLITE3_LIB_DIR=C:\ProgramData\chocolatey\lib\SQLite\tools' | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          'C:\ProgramData\chocolatey\lib\ffmpeg\tools\ffmpeg\bin' | Out-File $env:GITHUB_PATH -Append -Encoding utf8
          'C:\ProgramData\chocolatey\lib\SQLite\tools' | Out-File $env:GITHUB_PATH -Append -Encoding utf8

      - name: Prepare frontend assets
        shell: pwsh
        run: |
          bun install --frozen-lockfile
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          bun run build

      - name: Execute Rust tests on Windows
        id: rust
        shell: pwsh
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --workspace --no-run 2>&1 | Tee-Object -FilePath windows-rust-build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # A test binary that cannot load stops with 0xc0000139 before any
          # test runs. Name the culprit: for every DLL it imports from, the
          # copy the loader picks (System32 before PATH) and the imported
          # functions that copy does not export.
          function Show-MissingImports([string] $exe) {
            $imports = @{}
            $dll = $null
            foreach ($line in (dumpbin /nologo /imports $exe)) {
              if ($line -match '^\s{4}(\S+\.dll)\s*$') { $dll = $Matches[1].ToLowerInvariant(); if (-not $imports.ContainsKey($dll)) { $imports[$dll] = @() }; continue }
              if ($dll -and $line -match '^\s+[0-9A-Fa-f]+\s+(\S+)\s*$') { $imports[$dll] += $Matches[1] }
            }
            foreach ($dll in ($imports.Keys | Sort-Object)) {
              if ($dll -like 'api-ms-win-*') { continue }
              $candidates = @("$env:SystemRoot\System32\$dll") + @(($env:Path -split ';') | Where-Object { $_ } | ForEach-Object { Join-Path $_ $dll })
              $file = $candidates | Where-Object { Test-Path -LiteralPath $_ } | Select-Object -First 1
              if (-not $file) { "  $dll -> NOT FOUND"; continue }
              $exports = @{}
              foreach ($line in (dumpbin /nologo /exports $file)) {
                if ($line -match '^\s+\d+\s+[0-9A-Fa-f]+\s+(?:[0-9A-Fa-f]{8}\s+)?(\S+)') { $exports[$Matches[1]] = $true }
              }
              $missing = @($imports[$dll] | Where-Object { -not $exports.ContainsKey($_) })
              "  $dll -> $file ($((Get-Item -LiteralPath $file).VersionInfo.FileVersion)): $($imports[$dll].Count) imported, $($missing.Count) missing"
              $missing | Select-Object -First 15 | ForEach-Object { "    missing: $_" }
            }
          }
          $binary = Get-ChildItem "$env:CARGO_TARGET_DIR\debug\deps\r2_lib-*.exe" | Select-Object -First 1
          "Imports of $($binary.Name) before any runtime update:"
          Show-MissingImports $binary.FullName
          # Diagnostic attempt: the binary is linked by MSVC 14.44; install the
          # current VC++ runtime in case the image's System32 copy is older.
          $redist = Join-Path $env:RUNNER_TEMP 'vc_redist.x64.exe'
          Invoke-WebRequest -Uri 'https://aka.ms/vs/17/release/vc_redist.x64.exe' -OutFile $redist
          $install = Start-Process -FilePath $redist -ArgumentList '/install', '/quiet', '/norestart' -Wait -PassThru
          "vc_redist exit code: $($install.ExitCode)"
          "Imports of $($binary.Name) after the runtime update:"
          Show-MissingImports $binary.FullName
          cargo test --manifest-path src-tauri/Cargo.toml --workspace 2>&1 | Tee-Object -FilePath windows-rust-tests.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare disposable Windows NFS client
        shell: pwsh
        run: ./scripts/prepare-windows-nfs.ps1

      - name: Execute native mount read write rename unmount
        id: nfs
        shell: pwsh
        run: |
          for ($iteration = 1; $iteration -le 3; $iteration++) {
            python scripts/run-native-nfs-test.py 2>&1 | Tee-Object -FilePath "windows-nfs-$iteration.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Record exact runtime evidence
        # Field names/shape must match the windows-native-nfs-behavior gate in
        # acceptance-manifest.json: /status, /native_nfs/write_read_rename_unmount,
        # /runner, /source_fingerprint/production_source_sha256. status and
        # native_nfs.write_read_rename_unmount are derived from the actual step
        # outcomes below, never hardcoded to a passing value, so a loader
        # failure, reboot, empty run or skipped mount cannot read as a pass.
        # runner is the job's own runs-on label from the matrix, not a literal.
        if: always()
        shell: pwsh
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          R2_RUNNER_LABEL: ${{ matrix.runner }}
        run: |
          $binaries = @(Get-ChildItem "$env:CARGO_TARGET_DIR\debug\deps\r2_lib-*.exe" -ErrorAction SilentlyContinue | ForEach-Object {
            @{ path = $_.FullName; sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() }
          })
          $rustOutcome = '${{ steps.rust.outcome }}'
          $nfsOutcome = '${{ steps.nfs.outcome }}'
          $observed = ($rustOutcome -eq 'success') -and ($nfsOutcome -eq 'success')
          $sourceFingerprint = $null
          if (Test-Path source-fingerprint.json) {
            $sourceFingerprint = Get-Content source-fingerprint.json -Raw | ConvertFrom-Json
          }
          @{
            status = $(if ($observed) { 'observations_collected' } else { 'run_incomplete' })
            # The tested commit: actions/checkout on a pull_request event checks
            # out the ephemeral merge commit, not the PR branch head, so both are
            # recorded distinctly.
            source_commit = (git rev-parse HEAD)
            source_tree = (git rev-parse 'HEAD^{tree}')
            pr_head_sha = $env:PR_HEAD_SHA
            runner = $env:R2_RUNNER_LABEL
            runner_image = $env:ImageVersion
            image_os = $env:ImageOS
            platform = [System.Environment]::OSVersion.VersionString
            sdk = $env:R2_NATIVE_SDK
            mode = 'native_behavior'
            rust_outcome = $rustOutcome
            nfs_outcome = $nfsOutcome
            native_nfs = @{
              write_read_rename_unmount = $(if ($nfsOutcome -eq 'success') { 'passed' } else { 'failed' })
            }
            source_fingerprint = $sourceFingerprint
            binaries = $binaries
          } | ConvertTo-Json -Depth 8 | Out-File windows-native-nfs-behavior.json -Encoding utf8

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: windows-native-nfs-behavior
          path: |
            windows-native-nfs-behavior.json
            windows-rust-tests.log
            windows-nfs-*.log
          if-no-files-found: error
