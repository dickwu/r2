[workspace]
members = [".", "crates/range-dl"]

[package]
name = "r2"
version = "0.3.20"
description = "A desktop application for managing Cloudflare R2 storage buckets."
authors = ["Peilin Wu"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "r2_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-http = { version = "2.8.0", features = ["unsafe-headers"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Upload dependencies
reqwest = { version = "0.13.5", features = ["stream", "multipart"] }
mimetype-detector = "0.3.13"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "sync",
    "rt-multi-thread",
    "net",
    "macros",
    "process",
    "time",
] }
tokio-util = { version = "0.7", features = ["io"] }
sha2 = "0.11"
hmac = "0.13"
hex = "0.4"
base64 = "0.23"
chrono = "0.4"
urlencoding = "2"
lazy_static = "1.4"
turso = "0.9.0-pre"
log = "0.4"
# AWS S3 SDK for R2 operations
aws-config = "1.8"
aws-sdk-s3 = { version = "1.155.0", features = ["behavior-version-latest"] }
aws-credential-types = "1.2"
futures-util = "0.3"
# Image thumbnails: decode the common raster formats in-process (pure Rust)
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "webp", "bmp", "ico", "tiff"] }
# Lossy WebP encoding of cached thumbnails: libwebp, vendored and built with cc on
# every target. Used directly rather than via the `webp` crate, which pins
# libwebp-sys 0.9 (libwebp 1.3.1, before the CVE-2023-4863 fix).
libwebp-sys = { version = "0.14", default-features = false, features = ["std", "parallel"] }
# Multi-threaded download engine with Range-based parallel chunk acceleration
range-dl = { path = "crates/range-dl" }
# Dev-only: connector for AI-assisted testing (opt-in via --features connector)
tauri-plugin-connector = { version = "0.17", optional = true }
# Localhost NFSv3 server backing the "mount bucket as local drive" feature
nfsserve = "0.11"
async-trait = "0.1"

# uid/gid for the synthetic file attributes served over NFS
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Paused-clock tests (`#[tokio::test(start_paused = true)]`) for the list retry backoff
tokio = { version = "1", features = ["test-util"] }
# Streams nfsserve's RPC-level tracing from the native NFS smoke test (R2_NFS_TRACE);
# already in the build graph through turso, so it adds no crate
tracing-subscriber = "0.3"

[features]
default = []
connector = ["tauri-plugin-connector"]

# Thumbnail codecs are unusably slow unoptimized (a 24 MP JPEG takes ~4 s to
# decode and shrink in a debug build, ~0.1 s optimized), so dev builds and
# tests compile just these crates with optimizations. Release is unaffected.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.zune-core]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.gif]
opt-level = 3
[profile.dev.package.tiff]
opt-level = 3
[profile.dev.package.weezl]
opt-level = 3
[profile.dev.package.miniz_oxide]
opt-level = 3
[profile.dev.package.simd-adler32]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
